<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensajes - GeneraLazos</title>
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#8a2be2">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="../styles/mensajes.css">
</head>

<body>
    <div class="main">
        <header>
            <div class="logo">
                <img src="../images/heart.svg" alt="">
                <span>Genera<span class="subtext">Lazos</span></span>
            </div>
            <h2>Mensajes</h2>
        </header>

        <div class="search-container">
            <img src="../images/lupa.svg" alt="Buscar">
            <input type="search" id="searchChat" placeholder="Buscar conversaciones...">
        </div>

        <div class="chat-list">
            <div class="chat-item" data-name="Ana Lopez" data-avatar="/images/icono_perfil_usuario.svg">
                <div class="avatar">
                    <img src="../images/icono_perfil_usuario.svg" alt="Ana Lopez">
                </div>
                <div class="chat-info">
                    <div class="chat-header-row">
                        <span class="name">Ana Lopez</span>
                        <span class="time">10:45</span>
                    </div>
                    <p class="preview">Hola, ¿nos vemos en el parque este...</p>
                </div>
            </div>

            <div class="chat-item" data-name="Diego R" data-avatar="/images/perfil.svg">
                <div class="avatar">
                    <img src="../images/icono_perfil_usuario.svg" alt="Diego R">
                </div>
                <div class="chat-info">
                    <div class="chat-header-row">
                        <span class="name">Diego R</span>
                        <span class="time">Ayer</span>
                    </div>
                    <p class="preview">Perfecto, nos vemos para el paseo matutino.</p>
                </div>
            </div>

            <div class="chat-item" data-name="Carmen G" data-avatar="/images/icono_perfil_usuario.svg">
                <div class="avatar">
                    <img src="../images/icono_perfil_usuario.svg" alt="Carmen G">
                </div>
                <div class="chat-info">
                    <div class="chat-header-row">
                        <span class="name">Carmen G</span>
                        <span class="time">Lun</span>
                    </div>
                    <p class="preview">Gracias por la ayuda con el taller de huerto.</p>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div class="icon" id="nav-inicio">
            <img src="../images/casa.svg" alt="">
            <span>Inicio</span>
        </div>
        <div class="icon" id="nav-explorar">
            <img src="../images/lupa.svg" alt="">
            <span>Explorar</span>
        </div>
        <div class="icon active" id="nav-mensajes" style="position: relative;">
            <img src="../images/chat.svg" alt="">
            <span>Mensajes</span>
            <span class="notification-badge">3</span>
        </div>
        <div class="icon" id="nav-perfil">
            <img src="../images/perfil.svg" alt="">
            <span>Mi perfil</span>
        </div>
    </footer>

    <script src="../scripts/mensajes.js"></script>
</body>

</html>
