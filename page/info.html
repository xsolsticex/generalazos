<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido - GeneraLazos</title>
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#8a2be2">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link rel="stylesheet" href="../styles/info.css">
</head>

<body>
    <div class="content">
        <header>
            <div class="logo">
                <img src="../images/heart.svg" alt="">
                <span>Genera<span class="subtext">Lazos</span></span>
            </div>
        </header>

        <div class="main">
            <div class="swiper">
                <div class="swiper-wrapper">
                    <div class="swiper-slide">
                        <img src="../images/joven_anciano_paseando.svg" alt="Paseando juntos">
                    </div>
                    <div class="swiper-slide">
                        <img src="../images/paisaje_joven_anciana.svg" alt="Paisaje compartido">
                    </div>
                    <div class="swiper-slide">
                        <img src="../images/joven_anciano_jardineria_9x16.svg" alt="Jardinería urbana">
                    </div>
                </div>
                <div class="swiper-pagination"></div>
            </div>

            <div class="info-text">
                <h1>Conecta, comparte, disfruta</h1>
                <p>Encuentra personas de tu zona para pasear, aprender o disfrutar de actividades juntos en un entorno intergeneracional único.</p>
            </div>
        </div>

        <div class="bottom">
            <button id="siguienteBtn">Siguiente</button>
            <span id="saltarSpan">Saltar introducción</span>
        </div>
    </div>
    <script src="../scripts/info.js"></script>
</body>

</html>
