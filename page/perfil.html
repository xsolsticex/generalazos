<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - GeneraLazos</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#8a2be2">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="/styles/perfil.css">
</head>

<body>
    <header>
        <div class="profile">
            <div class="image">
                <img src="/images/icono_perfil_usuario.svg" alt="">
            </div>
            <div class="datos">
                <span>Sofia Martinez</span>
                <span>20 años · Estudiante</span>
            </div>

        </div>

        <button class="editar">
            <img src="/images/lapiz.svg" alt="">
        </button>
    </header>
    <div class="main">
        <div class="propiedad">
            <div class="left">
                <img src="/images/calendario.svg" alt="">
                <p>Mis actividades</p>
            </div>
            <p>&gt;</p>

        </div>
        <div class="propiedad">
            <div class="left">
                <img src="/images/mensaje.svg" alt="">
                <p>Mis mensajes</p>
            </div>
            <p>&gt;</p>

        </div>
        <div class="propiedad">
            <div class="intereses">
                <div class="top">
                    <div class="left">
                        <img src="/images/hands.svg" alt="">
                        <p>Mis intereses</p>
                    </div>
                    <p>&gt;</p>
                </div>
                <div class="tags">
                    <span class="naturaleza">Naturaleza</span>
                    <span class="cultura">Cultura</span>
                    <span class="deporte">Deporte</span>
                </div>
            </div>


        </div>
        <div class="propiedad">
            <div class="left">
                <img src="/images/configuracion.svg" alt="">
                <p>Configuración</p>
            </div>
            <p>&gt;</p>

        </div>
        <div class="propiedad">
            <div class="left">
                <img src="/images/ayuda.svg" alt="">
                <p>Ayuda</p>
            </div>
            <p>&gt;</p>

        </div>
        <div class="propiedad">
            <div class="left">
                <img src="/images/cerrar.svg" alt="">
                <p>Cerrar Sesión</p>
            </div>
            <p>&gt;</p>

        </div>
    </div>
    <footer>
        <div class="icon" id="nav-inicio">
            <img src="/images/casa.svg" alt="">
            <span>Inicio</span>
        </div>
        <div class="icon" id="nav-explorar">
            <img src="/images/lupa.svg" alt="">
            <span>Explorar</span>
        </div>
        <div class="icon" id="nav-mensajes" style="position: relative;">
            <img src="/images/chat.svg" alt="">
            <span>Mensajes</span>
            <span class="notification-badge">3</span>
        </div>
        <div class="icon active" id="nav-perfil">
            <img src="/images/perfil.svg" alt="">
            <span>Mi perfil</span>
        </div>
    </footer>
    <script src="/scripts/perfil.js"></script>
</body>

</html>
