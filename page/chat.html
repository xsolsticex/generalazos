<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - GeneraLazos</title>
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#8a2be2">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="../styles/chat.css">
</head>

<body>
    <header>
        <div class="back">
            <button>&lt;</button>
        </div>
        <div class="profile">
            <img src="../images/icono_perfil_usuario.svg" alt="">
            <div>
                <span>Ana Lopez</span>
                <span class="status">En Linea</span>
            </div>

        </div>
        <button>···</button>

    </header>
    <div class="main" id="chat">
        <div class="mensaje msg-emisor">
            <div class="emisor">
                <img src="../images/icono_perfil_usuario.svg" alt="">
            </div>
            <div class="contenido">
                <p>¡Hola! ¿Qué tal estás? Me alegro mucho de saludarte por aquí.</p>
            </div>
        </div>
        <div class="mensaje msg-receptor">
            <div class="emisor" hidden>
                <img src="../images/icono_perfil_usuario.svg" alt="">
            </div>
            <div class="contenido">
                <p>¡Hola! Todo muy bien, gracias.</p>
            </div>
        </div>
    </div>
    <footer>
        <input type="text" name="" id="" placeholder="Escribe un mensaje ...">
        <button>
            <img src="../images/enviar.svg" alt="">
        </button>
    </footer>
    <script src="../scripts/chat.js"></script>
</body>

</html>
